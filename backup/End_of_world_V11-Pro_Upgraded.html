<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Stock Guardian: Logistics Pro</title>
    <style>
        :root { --primary: #6366f1; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --danger: #ef4444; --ok: #22c55e; --edit: #f59e0b; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
        .container { max-width: 1200px; margin: auto; background: var(--card); padding: 30px; border-radius: 20px; }
        .controls { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-bottom: 20px; }
        input, select, button { padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #334155; color: white; }
        .ref-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
        .cat-box { background: #0f172a; padding: 15px; border-radius: 12px; border: 1px solid #334155; }
        .item-pill { display: block; padding: 4px 0; cursor: pointer; color: #94a3b8; font-size: 0.85rem; }
        .item-pill:hover { color: #60a5fa; }
        .status-ok { color: var(--ok); font-weight: bold; }
        .status-exp { color: var(--danger); font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; padding: 12px; color: #94a3b8; font-size: 0.7rem; text-transform: uppercase; }
        td { padding: 12px; border-top: 1px solid #334155; }
        .status-soon { color: var(--edit); font-weight: bold; }
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 20px; }
        .stat-card { background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 14px 16px; }
        .stat-card .num { font-size: 1.6rem; font-weight: 700; display: block; }
        .stat-card .label { font-size: 0.7rem; color: #94a3b8; text-transform: uppercase; }
        .toolbar { display: flex; gap: 10px; margin: 20px 0; flex-wrap: wrap; align-items: center; }
        .toolbar input[type="text"] { flex: 1; min-width: 160px; }
        .toolbar button { background: #334155; cursor: pointer; white-space: nowrap; }
        .toolbar .threshold { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: #94a3b8; }
        .toolbar .threshold input { width: 60px; padding: 8px; }
        .low-badge { color: var(--edit); font-size: 0.75rem; margin-left: 6px; }
    </style>
</head>
<body>

<div class="container">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2>Stock Guardian</h2>
        <select id="langSelect" onchange="render()"><option value="pt">PT</option><option value="en">EN</option><option value="es">ES</option></select>
    </div>

    <div class="controls">
        <input type="hidden" id="editIndex" value="-1">
        <input type="text" id="itemName" placeholder="Item" style="grid-column: span 2;">
        <input type="number" id="itemQty" placeholder="Qtd">
        <input type="text" id="itemLoc" placeholder="Local">
        <input type="date" id="expiryDate">
        <select id="itemCat"></select>
        <button onclick="saveItem()" style="background:var(--primary); cursor:pointer;">Save / Update</button>
    </div>

    <div class="dashboard" id="dashboard"></div>

    <div class="toolbar">
        <input type="text" id="searchBox" placeholder="Search..." oninput="render()">
        <button id="sortBtn" onclick="toggleSort()">Sort by Expiry</button>
        <span class="threshold">≤ <input type="number" id="lowStockThreshold" value="5" onchange="saveThreshold()"></span>
        <button onclick="exportData()">Export</button>
        <button onclick="document.getElementById('importFile').click()">Import</button>
        <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
    </div>

    <table><thead><tr id="tableHeader"></tr></thead><tbody id="inventoryBody"></tbody></table>

    <div style="margin-top:40px;">
        <h3 id="ref-title">Database</h3>
        <div id="ref-grid" class="ref-grid"></div>
    </div>
</div>

    const dict = {
        pt: { head: ["Item", "Qtd", "Local", "Categoria", "Validade", "Status", "Ação"], status: ["Bom", "Vence em breve", "Vencido"], ref: "Banco de Dados",
              search: "Buscar...", sortAsc: "Validade ↑", sortDesc: "Validade ↓", sortOff: "Ordenar por Validade",
              exportBtn: "Exportar", importBtn: "Importar", catBlank: "-- Categoria --",
              confirmDelete: "Tem certeza que deseja excluir este item?", low: "baixo",
              dash: { total: "Itens Totais", expired: "Vencidos", soon: "Vencendo em 30 dias", low: "Estoque Baixo" } },
        en: { head: ["Item", "Qty", "Loc", "Category", "Expiry", "Status", "Action"], status: ["Good", "Expiring soon", "Expired"], ref: "Database",
              search: "Search...", sortAsc: "Expiry ↑", sortDesc: "Expiry ↓", sortOff: "Sort by Expiry",
              exportBtn: "Export", importBtn: "Import", catBlank: "-- Category --",
              confirmDelete: "Are you sure you want to delete this item?", low: "low",
              dash: { total: "Total Items", expired: "Expired", soon: "Expiring in 30 days", low: "Low Stock" } },
        es: { head: ["Ítem", "Cant", "Ubic", "Categoría", "Caducidad", "Estado", "Acción"], status: ["Bueno", "Vence pronto", "Vencido"], ref: "Base de Datos",
              search: "Buscar...", sortAsc: "Caducidad ↑", sortDesc: "Caducidad ↓", sortOff: "Ordenar por Caducidad",
              exportBtn: "Exportar", importBtn: "Importar", catBlank: "-- Categoría --",
              confirmDelete: "¿Seguro que deseas eliminar este ítem?", low: "bajo",
              dash: { total: "Ítems Totales", expired: "Vencidos", soon: "Vencen en 30 días", low: "Stock Bajo" } }
    };

    let sortOrder = null; // null | 'asc' | 'desc'

    function toggleSort() {
        sortOrder = sortOrder === null ? 'asc' : (sortOrder === 'asc' ? 'desc' : null);
        render();
    }

    function saveThreshold() {
        localStorage.setItem('lowStockThreshold', document.getElementById('lowStockThreshold').value);
        render();
    }

    function exportData() {
        const blob = new Blob([JSON.stringify(inventory, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'stock_guardian_backup.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    function importData(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                if (Array.isArray(data)) {
                    inventory = data;
                    render();
                }
            } catch (err) {
                console.error('Invalid file', err);
            }
        };
        reader.readAsText(file);
        event.target.value = '';
    }

    function deleteItem(idx) {
        const lang = document.getElementById('langSelect').value;
        if (confirm(dict[lang].confirmDelete)) {
            inventory.splice(idx, 1);
            render();
        }
    }

    let inventory = JSON.parse(localStorage.getItem('myStock')) || [];

    function saveItem() {
        const idx = document.getElementById('editIndex').value;
        const item = {
            name: document.getElementById('itemName').value,
            qty: document.getElementById('itemQty').value,
            loc: document.getElementById('itemLoc').value,
            expiry: document.getElementById('expiryDate').value,
            cat: document.getElementById('itemCat').value
        };
        if(!item.name || !item.expiry) return;
        if(idx == -1) inventory.push(item); else inventory[idx] = item;
        document.getElementById('editIndex').value = -1;
        document.getElementById('itemName').value = '';
        document.getElementById('itemQty').value = '';
        document.getElementById('itemLoc').value = '';
        document.getElementById('expiryDate').value = '';
        document.getElementById('itemCat').value = '';
        render();
    }

    function editItem(idx) {
        const i = inventory[idx];
        document.getElementById('itemName').value = i.name;
        document.getElementById('itemQty').value = i.qty;
        document.getElementById('itemLoc').value = i.loc;
        document.getElementById('expiryDate').value = i.expiry;
        document.getElementById('itemCat').value = i.cat || '';
        document.getElementById('editIndex').value = idx;
    }

    function render() {
        const lang = document.getElementById('langSelect').value;
        const t = dict[lang];
        document.getElementById('tableHeader').innerHTML = t.head.map(h => `<th>${h}</th>`).join('');
        document.getElementById('ref-title').innerText = t.ref;

        const refGrid = document.getElementById('ref-grid');
        const cats = [...new Set(db.map(i => i.cat[lang]))];
        refGrid.innerHTML = cats.map(c => `
            <div class="cat-box"><strong>${c}</strong>
                ${db.filter(i => i.cat[lang] === c).map(i => `<span class="item-pill" onclick="document.getElementById('itemName').value='${i[lang]}'; document.getElementById('itemCat').value='${c}'">+ ${i[lang]}</span>`).join('')}
            </div>
        `).join('');

        // Populate category select, preserving current selection if possible
        const catSelect = document.getElementById('itemCat');
        const currentCatVal = catSelect.value;
        catSelect.innerHTML = `<option value="">${t.catBlank}</option>` + cats.map(c => `<option value="${c}">${c}</option>`).join('');
        if (cats.includes(currentCatVal)) catSelect.value = currentCatVal;

        // Restore sort button label
        document.getElementById('sortBtn').innerText = sortOrder === 'asc' ? t.sortAsc : (sortOrder === 'desc' ? t.sortDesc : t.sortOff);
        document.getElementById('searchBox').placeholder = t.search;

        const lowThreshold = parseFloat(localStorage.getItem('lowStockThreshold')) || 5;
        document.getElementById('lowStockThreshold').value = lowThreshold;

        const today = new Date().toISOString().split('T')[0];
        const soonDate = new Date();
        soonDate.setDate(soonDate.getDate() + 30);
        const soonStr = soonDate.toISOString().split('T')[0];

        function statusOf(expiry) {
            if (expiry < today) return 2; // expired
            if (expiry <= soonStr) return 1; // soon
            return 0; // ok
        }
        const statusClass = ['status-ok', 'status-soon', 'status-exp'];

        // Dashboard stats (based on full inventory, not filtered)
        const totalItems = inventory.length;
        const expiredCount = inventory.filter(i => statusOf(i.expiry) === 2).length;
        const soonCount = inventory.filter(i => statusOf(i.expiry) === 1).length;
        const lowCount = inventory.filter(i => parseFloat(i.qty) <= lowThreshold).length;
        document.getElementById('dashboard').innerHTML = `
            <div class="stat-card"><span class="num">${totalItems}</span><span class="label">${t.dash.total}</span></div>
            <div class="stat-card"><span class="num" style="color:var(--danger)">${expiredCount}</span><span class="label">${t.dash.expired}</span></div>
            <div class="stat-card"><span class="num" style="color:var(--edit)">${soonCount}</span><span class="label">${t.dash.soon}</span></div>
            <div class="stat-card"><span class="num" style="color:var(--edit)">${lowCount}</span><span class="label">${t.dash.low}</span></div>
        `;

        // Build searchable/sortable view while keeping original indices for actions
        const query = (document.getElementById('searchBox').value || '').toLowerCase();
        let rows = inventory.map((item, idx) => ({ item, idx })).filter(({ item }) => {
            if (!query) return true;
            return (item.name || '').toLowerCase().includes(query) ||
                   (item.loc || '').toLowerCase().includes(query) ||
                   (item.cat || '').toLowerCase().includes(query);
        });
        if (sortOrder === 'asc') rows.sort((a, b) => a.item.expiry.localeCompare(b.item.expiry));
        if (sortOrder === 'desc') rows.sort((a, b) => b.item.expiry.localeCompare(a.item.expiry));

        document.getElementById('inventoryBody').innerHTML = rows.map(({ item: i, idx }) => {
            const s = statusOf(i.expiry);
            const isLow = parseFloat(i.qty) <= lowThreshold;
            return `
            <tr><td>${i.name}</td><td>${i.qty}${isLow ? `<span class="low-badge">▼ ${t.low}</span>` : ''}</td><td>${i.loc}</td><td>${i.cat || ''}</td><td>${i.expiry}</td>
            <td class="${statusClass[s]}">${t.status[s]}</td>
            <td>
                <button onclick="editItem(${idx})" style="background:var(--edit)">✎</button>
                <button onclick="deleteItem(${idx})" style="background:var(--danger)">X</button>
            </td></tr>`;
        }).join('');
        localStorage.setItem('myStock', JSON.stringify(inventory));
    }
    render();
</script>
