# Builds the Android application and publishes the APK.
#
# Nothing about this build happens on a developer's machine: the Android SDK is
# several gigabytes and needed for one artifact, so it lives here instead. The
# only thing that has to exist locally is the signing key, and only once - see
# docs/ANDROID.md.
#
# Pushing a tag produces a GitHub Release with the APK attached, which is the
# copy you install. Running it by hand from the Actions tab produces the same
# APK as a workflow artifact, for checking a change without minting a version.
name: Build Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Capacitor 8 and the Android Gradle Plugin both require JDK 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Stop now, with a sentence anyone can act on, rather than 300 lines into
      # a Gradle stack trace.
      - name: Check the signing secrets are present
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          missing=""
          [ -n "$KEYSTORE" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$PASSWORD" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$ALIAS" ] || missing="$missing ANDROID_KEY_ALIAS"
          if [ -n "$missing" ]; then
            echo "Missing repository secrets:$missing"
            echo "Run 'npm run generate:android-key' locally and add the four values"
            echo "it writes to android-signing-secrets.txt. See docs/ANDROID.md."
            exit 1
          fi

      - run: npm ci

      - run: npm test

      # VITE_TARGET=android drops the service worker: the APK carries every
      # asset already, so a second cache in front of them buys nothing and can
      # serve the previous version's files after an update. The build's offline
      # audit still runs. It now permits one host - api.anthropic.com, reached
      # only from src/services/ai/client.ts - and still fails on every other
      # external URL.
      - name: Build the web application
        env:
          VITE_TARGET: android
        run: npm run build

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"

      # The keystore is written by Node rather than by keytool. This is where we
      # find out whether Java agrees it is a keystore - before Gradle spends ten
      # minutes getting to the same question.
      - name: Check Java can read the signing key
        env:
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          keytool -list -keystore "$RUNNER_TEMP/release.p12" \
            -storetype PKCS12 -storepass "$PASSWORD"

      - name: Install the Android platform this build targets
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Copy the web build into the Android project
        run: npx cap sync android

      # versionCode has to be an integer that only ever increases; the run
      # number is exactly that. versionName comes from package.json - see
      # android/app/build.gradle.
      - name: Assemble the signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Name the APK after its version
        id: apk
        run: |
          version=$(node -p "require('./package.json').version")
          name="stock-guardian-${version}-${{ github.run_number }}.apk"
          mv android/app/build/outputs/apk/release/app-release.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          ls -lh "$name"

      # Proof, in the build log, of exactly what the artifact that came out
      # asks the operating system for. aapt2 is part of build-tools.
      #
      # This step used to demand zero permissions, and that was the better
      # check. The AI assistant ended it: a key the user pastes in themselves
      # is useless unless the application can reach api.anthropic.com, and
      # Android has no narrower permission than INTERNET and no way to hold it
      # only while a feature is switched on. So the gate is narrowed, not
      # deleted. It allows exactly one foreign name and fails on every other.
      #
      # Two names pass, for different reasons.
      #
      # android.permission.INTERNET is a real capability asked of the system,
      # and the one the assistant cannot work without. Naming it here means a
      # second capability has to be a deliberate edit to this file, rather than
      # something a dependency merges in and nobody notices.
      #
      # Anything under app.stockguardian.android. is not asked of anyone: it
      # belongs to this application. androidx declares
      # DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION so that other applications
      # cannot reach its broadcast receivers. It grants no capability and is
      # never shown to a user.
      #
      # Everything else still fails the build: RECORD_AUDIO - which voice
      # control does not need, because the system's recognizer holds the
      # microphone - CAMERA, location, contacts, storage, and whatever the next
      # library arrives with.
      - name: Check the APK asks for INTERNET and nothing else
        env:
          APK: ${{ steps.apk.outputs.name }}
        run: |
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -1)
          "$AAPT2" dump permissions "$APK" | tee permissions.txt

          # cut on the quote: `uses-permission: name='android.permission.FOO'`
          unexpected=$(grep '^uses-permission:' permissions.txt | cut -d"'" -f2 \
            | grep -v '^app\.stockguardian\.android\.' \
            | grep -vx 'android\.permission\.INTERNET' || true)

          if [ -n "$unexpected" ]; then
            echo "The APK asks the operating system for:"
            echo "$unexpected"
            echo "Only android.permission.INTERNET is allowed here, and only because"
            echo "the AI assistant cannot reach api.anthropic.com without it."
            echo "Nothing else belongs in this APK. See docs/ANDROID.md."
            exit 1
          fi

          if grep -q "name='android.permission.INTERNET'" permissions.txt; then
            echo "The APK asks the operating system for INTERNET, and nothing else."
          else
            echo "The APK asks the operating system for no permission at all."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error

      # Only a tag produces something to install. `gh` is preinstalled on the
      # runner, so this needs no third-party action.
      - name: Attach the APK to a release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.name }}
        run: |
          cat > release-notes.md <<'NOTES'
          Download the `.apk` below on the phone and open it to install.

          Android will ask for permission to install from an unknown source. That
          is the expected prompt for an application that does not come from the
          Play Store, and it is asked once.

          This build asks Android for one permission, INTERNET, and only so that
          the AI assistant can reach api.anthropic.com with a key you paste in
          yourself. Leave the key blank and nothing is ever sent: the app runs
          with the radio off, exactly as before. Everything it needs to run is
          inside the file.
          NOTES

          gh release create "$GITHUB_REF_NAME" "$APK"             --title "Stock Guardian $GITHUB_REF_NAME"             --notes-file release-notes.md           || gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
