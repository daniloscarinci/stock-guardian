# Builds the Android application and publishes the APK.
#
# Nothing about this build happens on a developer's machine: the Android SDK is
# several gigabytes and needed for one artifact, so it lives here instead. The
# only thing that has to exist locally is the signing key, and only once - see
# docs/ANDROID.md.
#
# Pushing a tag produces a GitHub Release with the APK attached, which is the
# copy you install. Running it by hand from the Actions tab produces the same
# APK as a workflow artifact, for checking a change without minting a version.
name: Build Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Capacitor 8 and the Android Gradle Plugin both require JDK 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Stop now, with a sentence anyone can act on, rather than 300 lines into
      # a Gradle stack trace.
      - name: Check the signing secrets are present
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          missing=""
          [ -n "$KEYSTORE" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$PASSWORD" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$ALIAS" ] || missing="$missing ANDROID_KEY_ALIAS"
          if [ -n "$missing" ]; then
            echo "Missing repository secrets:$missing"
            echo "Run 'npm run generate:android-key' locally and add the four values"
            echo "it writes to android-signing-secrets.txt. See docs/ANDROID.md."
            exit 1
          fi

      - run: npm ci

      - run: npm test

      # VITE_TARGET=android drops the service worker: the APK carries every
      # asset already, so a second cache in front of them buys nothing and can
      # serve the previous version's files after an update. The build's offline
      # audit still runs. It now permits one host - api.anthropic.com, reached
      # only from src/services/ai/client.ts - and still fails on every other
      # external URL.
      - name: Build the web application
        env:
          VITE_TARGET: android
        run: npm run build

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"

      # The keystore is written by Node rather than by keytool. This is where we
      # find out whether Java agrees it is a keystore - before Gradle spends ten
      # minutes getting to the same question.
      - name: Check Java can read the signing key
        env:
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          keytool -list -keystore "$RUNNER_TEMP/release.p12" \
            -storetype PKCS12 -storepass "$PASSWORD"

      - name: Install the Android platform this build targets
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Copy the web build into the Android project
        run: npx cap sync android

      # versionCode has to be an integer that only ever increases; the run
      # number is exactly that. versionName comes from package.json - see
      # android/app/build.gradle.
      - name: Assemble the signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Name the APK after its version
        id: apk
        run: |
          version=$(node -p "require('./package.json').version")
          name="stock-guardian-${version}-${{ github.run_number }}.apk"
          mv android/app/build/outputs/apk/release/app-release.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          ls -lh "$name"

      # Proof, in the build log, of exactly what the artifact that came out
      # asks the operating system for. aapt2 is part of build-tools.
      #
      # This step has been narrowed three times and deleted never, which is the
      # point of it. It began by demanding zero permissions, and that was the
      # strongest version. Each widening below is one line of this file, argued
      # for, rather than a permission that arrived unnoticed.
      #
      # Four names pass, for four different reasons.
      #
      # android.permission.INTERNET is what the AI assistant cannot work
      # without. A key the user pastes in themselves is useless unless the
      # application can reach api.anthropic.com, and Android has no narrower
      # permission and no way to hold one only while a feature is switched on.
      #
      # android.permission.RECORD_AUDIO is the microphone, and it is new. This
      # application used to record nothing at all: speech arrived through
      # ACTION_RECOGNIZE_SPEECH, the system's own screen opened, and the system
      # held the microphone. That is the better design and it is gone, because
      # on the phone this is built for - a moto g35 5G - that Intent answers
      # "Voice search isn't available", while the keyboard's voice typing works
      # perfectly on the same device. SpeechPlugin now binds SpeechRecognizer
      # directly, the way the keyboard does, and that records in this process.
      # The user was asked and accepted the permission to have a microphone that
      # works. It is requested on the first press and never at startup.
      #
      # android.permission.POST_NOTIFICATIONS is the expiry reminders, and it is
      # the newest. From Android 13 nothing may post a notification without it.
      # It is requested at runtime the first time somebody switches the
      # reminders on in Settings, never at startup, and the switch ships off -
      # so a person who does not want to be interrupted is never shown the
      # dialog and this permission is never granted.
      #
      # @capacitor/local-notifications tried to bring three more with it, and
      # this check is how that was noticed rather than shipped:
      # SCHEDULE_EXACT_ALARM, RECEIVE_BOOT_COMPLETED and WAKE_LOCK. All three
      # are stripped at merge time by tools:node="remove" in
      # AndroidManifest.xml, which sets out the cost of each. If somebody
      # deletes those three lines, this step fails - which is exactly what it is
      # for. Do not add them to the list below; take them back out of the
      # manifest.
      #
      # Anything under app.stockguardian.android. is not asked of anyone: it
      # belongs to this application. androidx declares
      # DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION so that other applications
      # cannot reach its broadcast receivers. It grants no capability and is
      # never shown to a user.
      #
      # Everything else still fails the build: CAMERA, ACCESS_FINE_LOCATION,
      # READ_CONTACTS, the storage permissions, the three named above, and
      # whatever the next library arrives with. The check used to prove "this
      # application asks the system for nothing". It now proves "this
      # application asks for the network, the microphone and permission to
      # notify you, and nothing else", which is a weaker sentence and still
      # worth running on every build, because the way this promise would
      # actually be lost is one dependency quietly merging one more permission.
      - name: Check the APK asks for three permissions and no others
        env:
          APK: ${{ steps.apk.outputs.name }}
        run: |
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -1)
          "$AAPT2" dump permissions "$APK" | tee permissions.txt

          # cut on the quote: `uses-permission: name='android.permission.FOO'`
          unexpected=$(grep '^uses-permission:' permissions.txt | cut -d"'" -f2 \
            | grep -v '^app\.stockguardian\.android\.' \
            | grep -vx 'android\.permission\.INTERNET' \
            | grep -vx 'android\.permission\.RECORD_AUDIO' \
            | grep -vx 'android\.permission\.POST_NOTIFICATIONS' || true)

          if [ -n "$unexpected" ]; then
            echo "The APK asks the operating system for:"
            echo "$unexpected"
            echo "Three names are allowed here and no others."
            echo "  INTERNET           - the AI assistant cannot reach api.anthropic.com without it."
            echo "  RECORD_AUDIO       - the microphone. The permission-free Intent it replaces is"
            echo "                       not handled on the phone this is built for."
            echo "  POST_NOTIFICATIONS - the expiry reminders. Asked for when somebody switches"
            echo "                       them on, never at startup, and off by default."
            echo "Nothing else belongs in this APK. If one of SCHEDULE_EXACT_ALARM,"
            echo "RECEIVE_BOOT_COMPLETED or WAKE_LOCK is listed above, the tools:node=\"remove\""
            echo "lines in AndroidManifest.xml have been deleted. Put them back rather than"
            echo "widening this list. See docs/ANDROID.md."
            exit 1
          fi

          for expected in INTERNET RECORD_AUDIO POST_NOTIFICATIONS; do
            if grep -q "name='android.permission.$expected'" permissions.txt; then
              echo "The APK asks the operating system for $expected."
            else
              echo "The APK does not ask for $expected. Nothing here requires it to,"
              echo "but a feature that needs it will be silently dead. Check the manifest."
            fi
          done
          echo "It asks for nothing else."

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error

      # Only a tag produces something to install. `gh` is preinstalled on the
      # runner, so this needs no third-party action.
      - name: Attach the APK to a release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.name }}
        run: |
          cat > release-notes.md <<'NOTES'
          Download the `.apk` below on the phone and open it to install.

          Android will ask for permission to install from an unknown source. That
          is the expected prompt for an application that does not come from the
          Play Store, and it is asked once.

          This build asks Android for three permissions and no others.

          INTERNET, so the AI assistant can reach api.anthropic.com with a key
          you paste in yourself. Leave the key blank and nothing is ever sent.

          RECORD_AUDIO, for the microphone in the ask box. Android asks you for
          it the first time you press the microphone, never at startup, and the
          app works without it - typing is the same feature. Earlier builds
          needed no such permission because speech went through Google's own
          voice search screen; that screen is not available on every phone, and
          on the one this was built for it never opened at all.

          POST_NOTIFICATIONS, for the expiry reminders. They are off until you
          switch them on in Settings, and that switch is the only thing that
          ever raises the prompt. Switched on, the app works out what expires
          and hands the reminders to Android in advance, so they arrive whether
          or not you open the app - and the whole list is worked out again each
          time you do.

          The stock database still never leaves the phone. Everything the app
          needs to run is inside the file, and it runs with the radio off.
          NOTES

          gh release create "$GITHUB_REF_NAME" "$APK"             --title "Stock Guardian $GITHUB_REF_NAME"             --notes-file release-notes.md           || gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
