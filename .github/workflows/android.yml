# Builds the Android application and publishes the APK.
#
# Nothing about this build happens on a developer's machine: the Android SDK is
# several gigabytes and needed for one artifact, so it lives here instead. The
# only thing that has to exist locally is the signing key, and only once - see
# docs/ANDROID.md.
#
# Pushing a tag produces a GitHub Release with the APK attached, which is the
# copy you install. Running it by hand from the Actions tab produces the same
# APK as a workflow artifact, for checking a change without minting a version.
name: Build Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Capacitor 8 and the Android Gradle Plugin both require JDK 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Stop now, with a sentence anyone can act on, rather than 300 lines into
      # a Gradle stack trace.
      - name: Check the signing secrets are present
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          missing=""
          [ -n "$KEYSTORE" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$PASSWORD" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$ALIAS" ] || missing="$missing ANDROID_KEY_ALIAS"
          if [ -n "$missing" ]; then
            echo "Missing repository secrets:$missing"
            echo "Run 'npm run generate:android-key' locally and add the four values"
            echo "it writes to android-signing-secrets.txt. See docs/ANDROID.md."
            exit 1
          fi

      - run: npm ci

      - run: npm test

      # VITE_TARGET=android drops the service worker: the APK carries every
      # asset already, so a second cache in front of them buys nothing and can
      # serve the previous version's files after an update. The build's offline
      # audit still runs, and still fails on any external URL.
      - name: Build the web application
        env:
          VITE_TARGET: android
        run: npm run build

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"

      # The keystore is written by Node rather than by keytool. This is where we
      # find out whether Java agrees it is a keystore - before Gradle spends ten
      # minutes getting to the same question.
      - name: Check Java can read the signing key
        env:
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          keytool -list -keystore "$RUNNER_TEMP/release.p12" \
            -storetype PKCS12 -storepass "$PASSWORD"

      - name: Install the Android platform this build targets
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Copy the web build into the Android project
        run: npx cap sync android

      # versionCode has to be an integer that only ever increases; the run
      # number is exactly that. versionName comes from package.json - see
      # android/app/build.gradle.
      - name: Assemble the signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Name the APK after its version
        id: apk
        run: |
          version=$(node -p "require('./package.json').version")
          name="stock-guardian-${version}-${{ github.run_number }}.apk"
          mv android/app/build/outputs/apk/release/app-release.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          ls -lh "$name"

      # Proof, in the build log, that the two promises the manifest makes are
      # still true of the artifact that came out. aapt2 is part of build-tools.
      - name: Check the APK requests no permissions
        run: |
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -1)
          permissions=$("$AAPT2" dump permissions "${{ steps.apk.outputs.name }}" | grep -c "uses-permission" || true)
          echo "uses-permission entries: $permissions"
          if [ "$permissions" != "0" ]; then
            "$AAPT2" dump permissions "${{ steps.apk.outputs.name }}"
            echo "The APK requests permissions. It is meant to request none."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error

      # Only a tag produces something to install. `gh` is preinstalled on the
      # runner, so this needs no third-party action.
      - name: Attach the APK to a release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.name }}
        run: |
          cat > release-notes.md <<'NOTES'
          Download the `.apk` below on the phone and open it to install.

          Android will ask for permission to install from an unknown source. That
          is the expected prompt for an application that does not come from the
          Play Store, and it is asked once.

          This build requests no Android permissions and makes no network
          requests. Everything it needs is inside the file.
          NOTES

          gh release create "$GITHUB_REF_NAME" "$APK"             --title "Stock Guardian $GITHUB_REF_NAME"             --notes-file release-notes.md           || gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
