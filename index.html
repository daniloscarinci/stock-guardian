<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="description" content="Offline Preparedness &amp; Resource Management" />

    <!--
      Content Security Policy. This application is entirely local: it must never
      load or contact anything off-device. 'wasm-unsafe-eval' is required to
      instantiate the SQLite WebAssembly module and grants nothing else.

      `frame-ancestors` is deliberately absent: it is ignored when delivered in a
      <meta> element and can only be set as an HTTP response header. Including it
      here would look like protection while providing none. If this is ever
      hosted somewhere that can set headers, add
      `Content-Security-Policy: frame-ancestors 'none'` there - see docs/OFFLINE.md.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self' 'wasm-unsafe-eval';
               style-src 'self' 'unsafe-inline';
               img-src 'self' data: blob:;
               font-src 'self';
               connect-src 'self';
               worker-src 'self' blob:;
               object-src 'none';
               base-uri 'none';
               form-action 'none'"
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Stock Guardian</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Stock Guardian is an offline application and requires JavaScript to run. No data
      is ever sent anywhere; everything stays on this device.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
