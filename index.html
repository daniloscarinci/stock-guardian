<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="description" content="Offline Preparedness &amp; Resource Management" />

    <!--
      Content Security Policy. Everything this application loads is local: it
      must never fetch a script, a style, a font or an image from anywhere but
      its own origin. 'wasm-unsafe-eval' is required to instantiate the SQLite
      WebAssembly module and grants nothing else.

      `connect-src` carries the one exception, and it names one host rather
      than loosening the policy. The AI assistant sends a question to
      api.anthropic.com with a key the user pastes into Settings, so that
      origin is named below and no other is. With no key set, or the assistant
      switched off, nothing here is used and no request is made - the default
      behaviour is unchanged. Everything else still resolves to 'self', so a
      webfont, an analytics beacon or a CDN fallback added while debugging is
      still refused by the browser itself. Add nothing further here without
      changing docs/OFFLINE.md in the same commit.

      `frame-ancestors` is deliberately absent: it is ignored when delivered in a
      <meta> element and can only be set as an HTTP response header. Including it
      here would look like protection while providing none. If this is ever
      hosted somewhere that can set headers, add
      `Content-Security-Policy: frame-ancestors 'none'` there - see docs/OFFLINE.md.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self' 'wasm-unsafe-eval';
               style-src 'self' 'unsafe-inline';
               img-src 'self' data: blob:;
               font-src 'self';
               connect-src 'self' https://api.anthropic.com;
               worker-src 'self' blob:;
               object-src 'none';
               base-uri 'none';
               form-action 'none'"
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Stock Guardian</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Stock Guardian is an offline application and requires JavaScript to run. Your
      inventory stays on this device; nothing is sent anywhere unless you set up the
      AI assistant with your own API key.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
