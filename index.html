<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="description" content="Offline Preparedness &amp; Resource Management" />

    <!--
      Content Security Policy. This application is entirely local: it must never
      load or contact anything off-device. 'wasm-unsafe-eval' is required to
      instantiate the SQLite WebAssembly module and grants nothing else.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self' 'wasm-unsafe-eval';
               style-src 'self' 'unsafe-inline';
               img-src 'self' data: blob:;
               font-src 'self';
               connect-src 'self';
               worker-src 'self' blob:;
               object-src 'none';
               base-uri 'none';
               form-action 'none';
               frame-ancestors 'none'"
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Stock Guardian</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Stock Guardian is an offline application and requires JavaScript to run. No data
      is ever sent anywhere; everything stays on this device.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
