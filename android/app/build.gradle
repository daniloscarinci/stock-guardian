apply plugin: 'com.android.application'

/*
 * The version name comes from package.json, so the web application, the PWA
 * manifest and the APK cannot disagree about what version this is.
 *
 * The version code is separate because Android needs a plain increasing
 * integer and does not care what "2.0.0" means. CI passes the workflow run
 * number; a local build gets 1, which is fine because a local build is never
 * the one being distributed.
 */
def packageJson = new groovy.json.JsonSlurper().parse(file('../../package.json'))
def appVersionName = System.getenv("ANDROID_VERSION_NAME") ?: packageJson.version
def appVersionCode = (System.getenv("ANDROID_VERSION_CODE") ?: "1") as Integer

/*
 * Release signing, supplied entirely through the environment so no key material
 * is ever committed. `npm run generate:android-key` produces the keystore and
 * docs/ANDROID.md explains where the four values go.
 *
 * Every APK must be signed with the same key or Android will refuse to install
 * it over the previous one, and the only way to proceed is to uninstall - which
 * deletes the database. That makes a missing key a build-stopping error rather
 * than something to warn about and carry on from; see the check at the bottom
 * of this file.
 */
def releaseKeystore = System.getenv("ANDROID_KEYSTORE_PATH")

android {
    namespace = "app.stockguardian.android"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "app.stockguardian.android"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        if (releaseKeystore != null) {
            release {
                storeFile file(releaseKeystore)
                // PKCS#12, because the keystore is generated by Node rather than
                // by keytool - building this project needs no JDK on the machine
                // that creates the key. Java has read PKCS#12 natively for years
                // and it is keytool's own default format now.
                storeType "PKCS12"
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            if (releaseKeystore != null) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

/*
 * Without this, `assembleRelease` with no key configured succeeds and produces
 * an unsigned APK - which Android silently refuses to install, from a build
 * that reported success. Stop at the start of the task instead, and say what is
 * missing.
 */
afterEvaluate {
    tasks.named("assembleRelease").configure {
        doFirst {
            if (releaseKeystore == null) {
                throw new GradleException(
                    "No signing key. assembleRelease needs ANDROID_KEYSTORE_PATH, " +
                    "ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD " +
                    "in the environment. Run `npm run generate:android-key` and see " +
                    "docs/ANDROID.md. Use assembleDebug for a throwaway build."
                )
            }
        }
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
